<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Background -->
  <rect width="100%" height="100%" fill="#1a1a1a" />
  
  <!-- Circle Background -->
  <circle cx="100" cy="100" r="70" fill="#2a2a2a" />
  
  <!-- User Silhouette -->
  <path d="M100,60 
    a25,25 0 0 1 0,50 
    a25,25 0 0 1 0,-50
    M65,135
    a35,35 0 0 0 70,0
    a45,60 0 0 0 -70,0" 
    fill="#4d4d4d" />
    
  <!-- Subtle Glow Effect -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="rgba(0, 255, 255, 0.2)" stroke-width="2" />
</svg>
